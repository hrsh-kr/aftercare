AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Aftercare as one Lambda behind API Gateway: the pages and the API. Run locally with
  `sam local start-api` (no AWS account, no deploy); there is no other web server. The same
  template is what `sam deploy` would ship.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 120
    MemorySize: 512
    Environment:
      Variables:
        # Lambda's "localhost" is the container itself, not the host
        # machine running Ollama -- see agent.py's OLLAMA_HOST.
        OLLAMA_HOST: http://host.docker.internal:11434
        # The bundled linux/aarch64 Cedar CLI, not the host's macOS one
        # -- see cedar_authz.py's CEDAR_BIN.
        CEDAR_BIN: /var/task/tools/cedar/cedar
        # Lambdas have no disk worth keeping: state lives in DynamoDB. Locally that is
        # DynamoDB Local on the host; in an account, drop DYNAMODB_ENDPOINT and it is real.
        AFTERCARE_STORE: dynamodb
        DYNAMODB_ENDPOINT: http://host.docker.internal:8000
        AFTERCARE_TABLE: !Ref AftercareTable
        AFTERCARE_IDEMPOTENCY_TABLE: !Ref IdempotencyTable
        OPENSEARCH_HOST: http://host.docker.internal:9200
        AFTERCARE_DEMO: "1"   # enables POST /api/demo/reset. Remove for any real deployment.
        POWERTOOLS_SERVICE_NAME: aftercare
        LOG_LEVEL: INFO
        AFTERCARE_SECRET: local-dev-only-change-me

Resources:
  # Single-table design, see docs/DYNAMODB_DESIGN.md. Declared here so this template is a
  # complete, deployable description; under `sam local` the tables live in DynamoDB Local.
  AftercareTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: GSI1PK, AttributeType: S}
        - {AttributeName: GSI1SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - {AttributeName: GSI1PK, KeyType: HASH}
            - {AttributeName: GSI1SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: id, AttributeType: S}
      KeySchema:
        - {AttributeName: id, KeyType: HASH}
      TimeToLiveSpecification: {AttributeName: expiration, Enabled: true}

  # The whole web app: pages and API, one function behind API Gateway (see src/lambda_app.py).
  # One function, explicit routes (not a catch-all proxy: sam local's static-file route would shadow a
  # proxy). CodeUri is a staged folder (scripts/stage_lambda.sh) so the package holds only what runs.
  WebFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda_pkg/
      Handler: src.lambda_app.handler
      Timeout: 120
      Events:
        GetRoot:
          Type: Api
          Properties: {Path: "/", Method: get}
        GetDemo:
          Type: Api
          Properties: {Path: "/demo", Method: get}
        GetDashboard:
          Type: Api
          Properties: {Path: "/dashboard", Method: get}
        GetDashboardBrand:
          Type: Api
          Properties: {Path: "/dashboard/{brand}", Method: get}
        GetApiHealth:
          Type: Api
          Properties: {Path: "/api/health", Method: get}
        GetApiCustomers:
          Type: Api
          Properties: {Path: "/api/customers", Method: get}
        PostApiLookup:
          Type: Api
          Properties: {Path: "/api/lookup", Method: post}
        PostApiStart:
          Type: Api
          Properties: {Path: "/api/start", Method: post}
        PostApiRespond:
          Type: Api
          Properties: {Path: "/api/respond", Method: post}
        PostApiLogin:
          Type: Api
          Properties: {Path: "/api/login", Method: post}
        PostApiLogout:
          Type: Api
          Properties: {Path: "/api/logout", Method: post}
        GetApiMe:
          Type: Api
          Properties: {Path: "/api/me", Method: get}
        GetApiDashboardBrand:
          Type: Api
          Properties: {Path: "/api/dashboard/{brand}", Method: get}
        PostApiTicketsStatus:
          Type: Api
          Properties: {Path: "/api/tickets/{ticket_id}/status", Method: post}
        PostApiIngest:
          Type: Api
          Properties: {Path: "/api/ingest", Method: post}
        GetApiSampleCsv:
          Type: Api
          Properties: {Path: "/api/sample-csv", Method: get}
        PostApiDemoReset:
          Type: Api
          Properties: {Path: "/api/demo/reset", Method: post}
        GetSandbox:
          Type: Api
          Properties: {Path: "/sandbox", Method: get}
        PostApiWaWebhook:
          Type: Api
          Properties: {Path: "/api/wa/webhook", Method: post}
        GetApiWaMessages:
          Type: Api
          Properties: {Path: "/api/wa/messages", Method: get}
        GetApiInboxBrand:
          Type: Api
          Properties: {Path: "/api/inbox/{brand}", Method: get}
        GetApiTicketsTicketIdThread:
          Type: Api
          Properties: {Path: "/api/tickets/{ticket_id}/thread", Method: get}
        PostApiTicketsTicketIdReply:
          Type: Api
          Properties: {Path: "/api/tickets/{ticket_id}/reply", Method: post}
        GetApiSandboxCustomers:
          Type: Api
          Properties: {Path: "/api/sandbox/customers", Method: get}
        GetApiSandboxSamples:
          Type: Api
          Properties: {Path: "/api/sandbox/samples", Method: get}
        GetApiSandboxSamplesName:
          Type: Api
          Properties: {Path: "/api/sandbox/samples/{name}", Method: get}
        PostApiSandboxIngest:
          Type: Api
          Properties: {Path: "/api/sandbox/ingest", Method: post}
        PostApiSandboxReset:
          Type: Api
          Properties: {Path: "/api/sandbox/reset", Method: post}

Outputs:
  ApiUrl:
    Description: Local API Gateway base URL (after `sam local start-api`)
    Value: http://127.0.0.1:3000
