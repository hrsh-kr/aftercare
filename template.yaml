AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Aftercare's core API as local Lambda functions behind API Gateway --
  run entirely with `sam local start-api`, no AWS account, no deploy.
  Proves the logic in src/webapp/api_core.py is serverless-ready. The
  Flask app (src/webapp/app.py) is what the live demo actually runs;
  this is the "it isn't just a Flask app" proof, same logic underneath.

Globals:
  Api:
    # The demo page is served by Flask on another port, so the browser needs CORS to call
    # this API. Wide-open origin is fine for localhost, never for a real deployment.
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type,Idempotency-Key'"
      AllowMethods: "'GET,POST,OPTIONS'"
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        # Lambda's "localhost" is the container itself, not the host
        # machine running Ollama -- see agent.py's OLLAMA_HOST.
        OLLAMA_HOST: http://host.docker.internal:11434
        # The bundled linux/aarch64 Cedar CLI, not the host's macOS one
        # -- see cedar_authz.py's CEDAR_BIN.
        CEDAR_BIN: /var/task/tools/cedar-lambda/cedar
        # /var/task (the code mount) is read-only under real Lambda;
        # only /tmp is writable. See tickets.py / api_core.py.
        AFTERCARE_DATA_DIR: /tmp/aftercare-data
        # Lambdas have no disk worth keeping: state lives in DynamoDB. Locally that is
        # DynamoDB Local on the host; in an account, drop DYNAMODB_ENDPOINT and it is real.
        AFTERCARE_STORE: dynamodb
        DYNAMODB_ENDPOINT: http://host.docker.internal:8000
        AFTERCARE_TABLE: !Ref AftercareTable
        AFTERCARE_IDEMPOTENCY_TABLE: !Ref IdempotencyTable
        OPENSEARCH_HOST: http://host.docker.internal:9200
        AFTERCARE_DEMO: "1"   # enables POST /api/demo/reset. Remove for any real deployment.
        POWERTOOLS_SERVICE_NAME: aftercare
        LOG_LEVEL: INFO
        AFTERCARE_SECRET: local-dev-only-change-me

Resources:
  # Single-table design, see docs/DYNAMODB_DESIGN.md. Declared here so this template is a
  # complete, deployable description; under `sam local` the tables live in DynamoDB Local.
  AftercareTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: GSI1PK, AttributeType: S}
        - {AttributeName: GSI1SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - {AttributeName: GSI1PK, KeyType: HASH}
            - {AttributeName: GSI1SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: id, AttributeType: S}
      KeySchema:
        - {AttributeName: id, KeyType: HASH}
      TimeToLiveSpecification: {AttributeName: expiration, Enabled: true}

  CustomersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.lambda_handlers.customers
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/customers
            Method: get

  LookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.lambda_handlers.lookup
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/lookup
            Method: post

  ConversationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.lambda_handlers.conversation
      # One function, not two -- /api/start and /api/respond need to
      # share a warm container's /tmp to carry a conversation across
      # turns. See lambda_handlers.py's conversation() docstring.
      Events:
        Start:
          Type: Api
          Properties:
            Path: /api/start
            Method: post
        Respond:
          Type: Api
          Properties:
            Path: /api/respond
            Method: post

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.lambda_handlers.health
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/health
            Method: get

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.lambda_handlers.dashboard
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/dashboard/{brand}
            Method: get

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.lambda_handlers.login
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/login
            Method: post

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.lambda_handlers.me
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/me
            Method: get

  TicketStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.lambda_handlers.ticket_status
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/tickets/{ticket_id}/status
            Method: post

  DemoResetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.lambda_handlers.demo_reset
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/demo/reset
            Method: post

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.lambda_handlers.ingest
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/ingest
            Method: post

Outputs:
  ApiUrl:
    Description: Local API Gateway base URL (after `sam local start-api`)
    Value: http://127.0.0.1:3000
