<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aftercare — Dashboard</title>
  <meta name="description" content="Sign in to your brand's Aftercare analytics dashboard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #06040e;
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .dl-wrap {
      width: 100%;
      max-width: 460px;
      text-align: center;
    }
    /* Logo / wordmark */
    .dl-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: 40px;
    }
    .dl-mark {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #5E5CE6, #007AFF);
      color: #fff; font-size: 16px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
    }
    .dl-wordmark { font-size: 20px; font-weight: 800; letter-spacing: -.03em; color: #f5f5f7; }

    /* Card */
    .dl-card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 20px;
      padding: 36px;
    }
    .dl-title {
      font-size: 24px; font-weight: 900; letter-spacing: -.03em;
      color: #f5f5f7; margin-bottom: 6px;
    }
    .dl-sub {
      font-size: 14px; color: rgba(245,245,247,.4);
      margin-bottom: 28px; line-height: 1.6;
    }

    /* Brand buttons */
    .dl-brands { display: flex; flex-direction: column; gap: 8px; }
    .dl-brand-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.08);
      text-decoration: none;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .2s ease;
    }
    .dl-brand-btn:hover {
      background: rgba(255,255,255,.07);
      border-color: rgba(255,255,255,.18);
      transform: translateX(3px);
    }
    .dl-brand-dot {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: #fff;
      flex-shrink: 0;
    }
    .dl-brand-text { text-align: left; }
    .dl-brand-name { font-size: 15px; font-weight: 700; color: #f5f5f7; }
    .dl-brand-hint { font-size: 12px; color: rgba(245,245,247,.35); }
    .dl-brand-arrow { margin-left: auto; color: rgba(245,245,247,.25); font-size: 18px; }

    .dl-staff input { position: absolute; opacity: 0; pointer-events: none; }
    .dl-staff:has(input:checked) { border-color: #5aa0ff; background: rgba(90,160,255,.1); }
    .dl-staff:has(input:focus-visible) { outline: 2px solid #5aa0ff; outline-offset: 2px; }
    .dl-pass { width: 100%; margin-top: 18px; padding: 13px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.05); color: #f5f5f7; font: inherit; font-size: 15px; }
    .dl-demo { margin-top: 10px; font-size: 12px; color: rgba(245,245,247,.4); text-align: left; }
    .dl-demo code { background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 6px; }
    .dl-err { margin-top: 10px; font-size: 13px; color: #ff8fa5; text-align: left; }
    .dl-go { width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 980px; cursor: pointer; font: inherit; font-size: 16px;
      font-weight: 600; color: #fff; background: linear-gradient(135deg,#5E5CE6,#0a7cff); }
    .dl-go:disabled { opacity: .5; }

    /* Footer */
    .dl-footer {
      margin-top: 28px;
      font-size: 12.5px;
      color: rgba(245,245,247,.22);
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .dl-footer a { color: inherit; text-decoration: none; }
    .dl-footer a:hover { color: rgba(245,245,247,.5); }
  </style>
</head>
<body>
  <div class="dl-wrap">
    <a class="dl-logo" href="/">
      <div class="dl-mark">A</div>
      <span class="dl-wordmark">Aftercare</span>
    </a>

    <div class="dl-card">
      <div class="dl-title">Staff sign-in</div>
      <div class="dl-sub">Choose an account and enter its passcode. The server signs you in; Cedar then decides what you may see and change.</div>

      <form id="dl-form" autocomplete="off">
        <div class="dl-brands" role="radiogroup" aria-label="Staff account">
          {% for u in staff %}
          <label class="dl-brand-btn dl-staff">
            <input type="radio" name="username" value="{{ u.username }}" data-brand="{{ u.brand }}" data-code="{{ u.brand[:4] == 'aqua' and 'aqua' or 'arctic' }}-{{ u.role }}" {% if loop.first %}checked{% endif %}>
            <div class="dl-brand-dot" style="background: linear-gradient(135deg,
              hsl({{ (brands.keys()|list).index(u.brand) * 67 + 67 }},55%,28%),
              hsl({{ (brands.keys()|list).index(u.brand) * 67 + 107 }},65%,45%));">{{ brands[u.brand][:2] }}</div>
            <div class="dl-brand-text">
              <div class="dl-brand-name">{{ u.name }}</div>
              <div class="dl-brand-hint">{{ brands[u.brand] }} · {{ u.role }}</div>
            </div>
          </label>
          {% endfor %}
        </div>
        <input class="dl-pass" id="dl-pass" type="password" placeholder="Passcode" aria-label="Passcode" required>
        <p class="dl-demo" id="dl-demo"></p>
        <p class="dl-err" id="dl-err" role="alert" hidden></p>
        <button class="dl-go" type="submit">Sign in</button>
      </form>
    </div>

    <div class="dl-footer">
      <a href="/">← Back to Aftercare</a>
      <span>·</span>
      <a href="/demo">Live demo</a>
    </div>
  </div>
  <script>
    const form = document.getElementById("dl-form"), pass = document.getElementById("dl-pass"),
          err = document.getElementById("dl-err"), demo = document.getElementById("dl-demo");
    const nextBrand = new URLSearchParams(location.search).get("brand");
    function hint() {
      const r = form.querySelector("input[name=username]:checked");
      demo.textContent = "";
      demo.append("Demo passcode: ");
      const c = document.createElement("code"); c.textContent = r.dataset.code; demo.append(c);
    }
    form.addEventListener("change", hint); hint();
    if (nextBrand) { const r = form.querySelector(`input[data-brand="${CSS.escape(nextBrand)}"]`); if (r) { r.checked = true; hint(); } }
    form.addEventListener("submit", async (e) => {
      e.preventDefault(); err.hidden = true;
      const r = form.querySelector("input[name=username]:checked");
      const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: r.value, passcode: pass.value }) });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error || "Sign-in failed."; err.hidden = false; return; }
      location.href = "/dashboard/" + data.principal.brand;
    });
  </script>
</body>
</html>
